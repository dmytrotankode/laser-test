<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>3030 — лінія межі пресування</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8;
          --up:#38bdf8; --ce:#f59e0b; --lo:#22c55e; --man:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.45 system-ui,Segoe UI,sans-serif; display:flex; height:100vh; }
  #side { width:330px; flex:none; background:var(--panel); border-right:1px solid var(--line);
          padding:14px; overflow:auto; }
  #main { flex:1; position:relative; overflow:hidden; background:#000; }
  canvas { position:absolute; inset:0; cursor:crosshair; }
  h2 { margin:0 0 4px; font-size:15px; }
  .hint { color:var(--mut); font-size:12px; margin:0 0 14px; }
  .row { display:flex; align-items:center; gap:8px; margin:7px 0; }
  .row label { flex:1; font-size:12px; color:var(--mut); }
  .row input[type=range] { width:130px; }
  .row .val { width:44px; text-align:right; font-family:monospace; font-size:12px; }
  select, button { background:#0b1220; color:var(--txt); border:1px solid var(--line);
                   border-radius:6px; padding:7px 9px; font-size:13px; }
  button { cursor:pointer; }
  button.go { background:#1d4ed8; border-color:#1d4ed8; font-weight:600; }
  button.save { background:#166534; border-color:#166534; font-weight:600; }
  button.warn { background:#7f1d1d; border-color:#7f1d1d; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:14px 0; padding:10px; }
  legend { color:var(--mut); font-size:12px; padding:0 5px; }
  .leg { display:flex; align-items:center; gap:6px; font-size:12px; margin:3px 0; }
  .sw { width:15px; height:3px; border-radius:2px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:right; padding:3px 4px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  #status { font-size:12px; color:var(--mut); min-height:18px; margin-top:8px; }
  #hud { position:absolute; left:10px; bottom:10px; background:rgba(15,23,42,.85);
         border:1px solid var(--line); border-radius:6px; padding:6px 9px;
         font:12px/1.4 monospace; pointer-events:none; }
  #prof { position:absolute; right:10px; bottom:10px; background:rgba(15,23,42,.9);
          border:1px solid var(--line); border-radius:6px; }
</style>
</head>
<body>
<div id="side">
  <h2>Лінія межі пресування</h2>
  <p class="hint">Колесо — масштаб, тягнути — зсув. Клік — поставити точку еталона,
     клік по точці — прибрати.</p>

  <div class="row">
    <select id="variant" style="flex:1"></select>
    <select id="view"></select>
  </div>
  <button class="go" id="run" style="width:100%">Знайти лінії</button>

  <fieldset>
    <legend>лінії</legend>
    <div class="leg"><span class="sw" style="background:var(--up)"></span>
      <input type="checkbox" id="c_upper" checked> верхня межа тіні</div>
    <div class="leg"><span class="sw" style="background:var(--ce)"></span>
      <input type="checkbox" id="c_center" checked> дно борозни</div>
    <div class="leg"><span class="sw" style="background:var(--lo)"></span>
      <input type="checkbox" id="c_lower" checked> нижня межа тіні</div>
    <div class="leg"><span class="sw" style="background:var(--man)"></span>
      <input type="checkbox" id="c_manual" checked> ваш еталон</div>
  </fieldset>

  <fieldset>
    <legend>налаштування пошуку</legend>
    <div class="row"><label>смуга пошуку, верх</label>
      <input type="range" id="band_lo" min="0" max="0.9" step="0.05" value="0.45">
      <span class="val" id="v_band_lo"></span></div>
    <div class="row"><label>вікно порівняння, px</label>
      <input type="range" id="win" min="5" max="60" step="1" value="25">
      <span class="val" id="v_win"></span></div>
    <div class="row"><label>жорсткість лінії</label>
      <input type="range" id="jump" min="1" max="20" step="1" value="6">
      <span class="val" id="v_jump"></span></div>
    <div class="row"><label>межі тіні, частка</label>
      <input type="range" id="edge" min="0.1" max="0.9" step="0.05" value="0.5">
      <span class="val" id="v_edge"></span></div>
    <div class="row"><label>згладжування</label>
      <input type="range" id="smooth" min="1" max="41" step="2" value="9">
      <span class="val" id="v_smooth"></span></div>
    <div class="row"><label>крок по X, px</label>
      <input type="range" id="step" min="1" max="16" step="1" value="4">
      <span class="val" id="v_step"></span></div>
  </fieldset>

  <fieldset>
    <legend>еталон</legend>
    <div class="row">
      <button class="save" id="save" style="flex:1">Зберегти</button>
      <button class="warn" id="clear">Очистити</button>
    </div>
    <div class="row"><button id="cmp" style="width:100%">Порівняти з еталоном</button></div>
    <table id="metrics"></table>
  </fieldset>

  <div id="status"></div>
</div>

<div id="main">
  <canvas id="cv"></canvas>
  <div id="hud">—</div>
  <canvas id="prof" width="220" height="110"></canvas>
</div>

<script src="/static/js/app.js?v=1"></script>
</body>
</html>
