<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Form 2 – Optimized LS Correction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/form2.css">
    <script src="/static/js/form2.js" defer></script>
</head>
<body>
    <h1>Form 2 – New LS‑Correction Workflow</h1>

    <!-- hidden field for autogenerated session id -->
    <div class="session-controls hidden">
        <input type="hidden" id="session-id" />
    </div>

    <div class="container">
        <div id="pipeline" class="pipeline hidden">
            <p>Session <span id="session-badge"></span> started. Execute the steps below.</p>
            <div class="steps">
                <button class="btn" id="start-calc-btn">Start calculation</button>
                <button class="btn" id="visualize-btn" disabled>Visualize result</button>
            </div>
            <div class="log-container">
                <h3>Global Log</h3>
                <pre id="global-log"></pre>
            </div>
        </div>
        <aside class="sidebar hidden" id="metrics-panel">
            <h3>Показники</h3>
            <ul id="metrics-list"></ul>
            <div id="metrics-details" style="margin-top:0.5rem;"></div>
        </aside>
        <aside class="sidebar hidden" id="detailed-panel" style="font-size:0.8rem; line-height:1.4;">
            <h3>Детальний звіт</h3>
            <div id="detailed-report-content"></div>
        </aside>
    </div>
</body>
</html>
