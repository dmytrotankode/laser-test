<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Step 13: Original LS Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #121212; color: #fff; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem; }
    </style>
</head>
<body>
    <div id="loading">Завантаження даних...</div>
    <div id="canvas-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        let scene, camera, renderer, controls;

        if (!sessionId) {
            document.getElementById('loading').innerText = 'Помилка: Не вказано session_id';
        } else {
            try {
                initScene();
                loadData();
            } catch (err) {
                document.getElementById('loading').innerText = 'Помилка ініціалізації 3D сцени: ' + err.message;
                console.error(err);
            }
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(0, -300, 300);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.1;

            const gridHelper = new THREE.GridHelper(1000, 20, 0x444444, 0x222222);
            gridHelper.rotation.x = Math.PI / 2;
            scene.add(gridHelper);

            const axesHelper = new THREE.AxesHelper(200);
            scene.add(axesHelper);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        async function loadData() {
            try {
                const res = await fetch(`/api/step13_visualisation_data?session_id=${sessionId}`);
                const data = await res.json();
                console.log('step13_visualisation_data response:', data);
                if (data.error) {
                    document.getElementById('loading').innerText = 'Помилка: ' + data.error;
                    return;
                }
                let orig = data.original_points || [];
                let corr = data.corrected_points || [];
                
                // Fallback to fetch original LS if empty
                if (!orig.length) {
                    try {
                        const resOrig = await fetch(`/api/ls_as_json?session_id=${sessionId}&type=original`);
                        const origData = await resOrig.json();
                        if (!origData.error) {
                            orig = origData;
                        }
                    } catch (e) { console.error(e); }
                }

                // Fallback to fetch corrected LS if empty
                if (!corr.length) {
                    try {
                        const resCorr = await fetch(`/api/ls_as_json?session_id=${sessionId}&type=corrected`);
                        const corrData = await resCorr.json();
                        if (!corrData.error) {
                            corr = corrData;
                        }
                    } catch (e) { console.error(e); }
                }

                if (!orig.length && !corr.length) {
                    document.getElementById('loading').innerText = 'Немає даних для відображення';
                    return;
                }

                document.getElementById('loading').style.display = 'none';

                const createPointCloud = (points, color) => {
                    const geometry = new THREE.BufferGeometry();
                    const vertices = [];
                    points.forEach(p => { vertices.push(p.x, p.y, p.z); });
                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                    const material = new THREE.PointsMaterial({ color: color, size: 3, sizeAttenuation: false });
                    return new THREE.Points(geometry, material);
                };

                if (orig.length) scene.add(createPointCloud(orig, 0xffff00)); // yellow original
                if (corr.length) scene.add(createPointCloud(corr, 0x00ffff)); // cyan corrected

                // Center camera on combined points
                const all = orig.concat(corr);
                if (all.length) {
                    let cx = 0, cy = 0, cz = 0;
                    all.forEach(p => { cx += p.x; cy += p.y; cz += p.z; });
                    cx /= all.length; cy /= all.length; cz /= all.length;
                    controls.target.set(cx, cy, cz);
                    camera.position.set(cx, cy - 300, cz + 200);
                    controls.update();
                }
            } catch (err) {
                document.getElementById('loading').innerText = 'Помилка завантаження: ' + err.message;
            }
        }
    </script>
</body>
</html>
